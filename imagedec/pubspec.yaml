name: your_project_name
description: A new Flutter project.

# Prevent publishing to pub.dev (remove if you want to publish)
publish_to: 'none'

# Environment settings
environment:
  sdk: ">=2.17.0 <3.0.0"

# Project dependencies
dependencies:
  flutter:
    sdk: flutter

  # UI Components
  cupertino_icons: ^1.0.8

  # Web-specific image picker
  image_picker_web: ^2.0.1

  # Networking
  http: ^0.13.6

  # Machine learning (optional, included for potential future use)
  google_ml_kit: ^0.16.3

  # Environment variable loader
  flutter_dotenv: ^5.1.0

  # PDF generation and printing
  pdf: ^3.6.0
  printing: ^5.5.1

# Development-only dependencies
dev_dependencies:
  flutter_test:
    sdk: flutter

# Flutter configuration
flutter:
  uses-material-design: true

